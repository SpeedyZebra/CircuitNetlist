[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circuit-netlist"
version = "0.1.0"
description = "Component-library-driven interactive electronic schematic viewer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "lark>=1.1,<2",
  "networkx>=3.3,<4",
  "pillow>=12,<13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "unit: fast isolated tests for individual functions and small models",
  "integration: tests that exercise multiple subsystems together",
  "audit: full circuit inventory or quality-gate tests",
  "slow: tests that are useful for full QA but too slow for the fast development loop",
]
