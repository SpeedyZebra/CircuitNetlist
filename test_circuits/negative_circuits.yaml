version: 1
classification: negative
circuits:
  - id: 01_led_missing_resistor
    name: Missing LED Resistor
    path: test_circuits/faults/01_led_resistor/missing_resistor.cnet
    topology_family: LED resistor
    purpose: LED intentionally has no current-limiting resistor.
    expected_diagnostics: [ERC_LED_NO_CURRENT_LIMIT]
    render_allowed: true
  - id: 01_led_reversed
    name: Reversed LED
    path: test_circuits/faults/01_led_resistor/reversed_led.cnet
    topology_family: LED resistor
    purpose: LED polarity is intentionally reversed.
    expected_diagnostics: [ERC_LED_POLARITY_REVERSED]
    render_allowed: true
  - id: 01_led_terminals_shorted
    name: LED Terminals Shorted
    path: test_circuits/faults/01_led_resistor/led_terminals_shorted.cnet
    topology_family: LED resistor
    purpose: LED anode and cathode are intentionally tied together.
    expected_diagnostics: [ERC_LED_TERMINALS_SHORTED]
    render_allowed: true
  - id: 01_led_power_ground_short
    name: Power Ground Short
    path: test_circuits/faults/01_led_resistor/power_ground_short.cnet
    topology_family: LED resistor
    purpose: VCC and GND are intentionally shorted by pin assignment.
    expected_diagnostics: [VALIDATION_PIN_MULTIPLE_NETS, ERC_POWER_GND_SHORT, ERC_SUPPLY_NET_CONFLICT, ERC_POSITIVE_TERMINAL_ON_GROUND, ERC_NEGATIVE_TERMINAL_ON_POSITIVE_RAIL]
    render_allowed: false
  - id: 01_led_invalid_pin
    name: Invalid LED Pin
    path: test_circuits/faults/01_led_resistor/invalid_pin.cnet
    topology_family: LED resistor
    purpose: Netlist intentionally references an unknown LED pin.
    expected_diagnostics: [VALIDATION_UNKNOWN_PIN]
    render_allowed: false
  - id: 01_led_unknown_component
    name: Unknown Component
    path: test_circuits/faults/01_led_resistor/unknown_component.cnet
    topology_family: LED resistor
    purpose: Component type and references are intentionally unknown.
    expected_diagnostics: [VALIDATION_UNKNOWN_COMPONENT, VALIDATION_UNKNOWN_REF, VALIDATION_UNKNOWN_REF]
    render_allowed: false
  - id: 02_mosfet_floating_gate
    name: Floating MOSFET Gate
    path: test_circuits/faults/02_mosfet_switch/floating_gate.cnet
    topology_family: MOSFET low-side switch
    purpose: MOSFET gate is intentionally left floating.
    expected_diagnostics: [ERC_MOSFET_GATE_FLOATING]
    render_allowed: true
  - id: 02_mosfet_missing_pulldown
    name: Missing MOSFET Pull-Down
    path: test_circuits/faults/02_mosfet_switch/missing_gate_pulldown.cnet
    topology_family: MOSFET low-side switch
    purpose: MOSFET gate intentionally lacks a pull-down resistor.
    expected_diagnostics: [ERC_MOSFET_GATE_NO_PULLDOWN]
    render_allowed: true
  - id: 02_mosfet_source_not_ground
    name: MOSFET Source Not Ground
    path: test_circuits/faults/02_mosfet_switch/source_not_ground.cnet
    topology_family: MOSFET low-side switch
    purpose: Low-side NMOS source is intentionally not tied to ground.
    expected_diagnostics: [ERC_MOSFET_SOURCE_NOT_GROUND]
    render_allowed: true
  - id: 03_divider_midpoint_grounded
    name: Divider Midpoint Grounded
    path: test_circuits/faults/03_voltage_divider_adc/midpoint_shorted_to_ground.cnet
    topology_family: voltage divider
    purpose: Divider midpoint is intentionally shorted to ground.
    expected_diagnostics: [ERC_DIVIDER_MIDPOINT_GROUNDED]
    render_allowed: true
  - id: 03_divider_adc_unconnected
    name: Divider ADC Unconnected
    path: test_circuits/faults/03_voltage_divider_adc/adc_unconnected.cnet
    topology_family: voltage divider
    purpose: Divider midpoint intentionally does not feed an MCU ADC/input pin.
    expected_diagnostics: [ERC_ADC_PIN_UNCONNECTED]
    render_allowed: true
  - id: 03_divider_missing_bottom
    name: Divider Missing Bottom Resistor
    path: test_circuits/faults/03_voltage_divider_adc/missing_bottom_resistor.cnet
    topology_family: voltage divider
    purpose: Divider intentionally lacks the bottom resistor.
    expected_diagnostics: [ERC_DIVIDER_BOTTOM_MISSING]
    render_allowed: true
  - id: erc_dc_source_terminals_shorted
    name: DC Source Terminals Shorted
    path: test_circuits/faults/erc_open_short/dc_source_terminals_shorted.cnet
    topology_family: ERC open/short
    purpose: DC source positive and negative terminals are intentionally tied together.
    expected_diagnostics: [ERC_SOURCE_TERMINALS_SHORTED, ERC_POWER_GND_SHORT, ERC_SUPPLY_NET_CONFLICT, ERC_POSITIVE_TERMINAL_ON_GROUND, ERC_NEGATIVE_TERMINAL_ON_POSITIVE_RAIL]
    render_allowed: true
  - id: erc_mcu_power_reversed
    name: MCU Power Reversed
    path: test_circuits/faults/erc_open_short/mcu_power_reversed.cnet
    topology_family: ERC open/short
    purpose: MCU VDD and GND are intentionally swapped.
    expected_diagnostics: [ERC_GROUND_PIN_ON_POSITIVE_RAIL, ERC_POSITIVE_SUPPLY_PIN_ON_GROUND, ERC_POSITIVE_TERMINAL_ON_GROUND, ERC_NEGATIVE_TERMINAL_ON_POSITIVE_RAIL, ERC_POWER_GND_SHORT, ERC_POWER_GND_SHORT, ERC_SUPPLY_NET_CONFLICT, ERC_SUPPLY_NET_CONFLICT, ERC_POWER_INPUT_NO_SOURCE]
    render_allowed: true
  - id: erc_battery_polarity_reversed
    name: Battery Polarity Reversed
    path: test_circuits/faults/erc_open_short/battery_polarity_reversed.cnet
    topology_family: ERC open/short
    purpose: Battery positive is on ground and negative is on VBAT.
    expected_diagnostics: [ERC_POSITIVE_TERMINAL_ON_GROUND, ERC_NEGATIVE_TERMINAL_ON_POSITIVE_RAIL, ERC_POWER_GND_SHORT, ERC_POWER_GND_SHORT, ERC_SUPPLY_NET_CONFLICT, ERC_SUPPLY_NET_CONFLICT]
    render_allowed: true
  - id: erc_solar_polarity_reversed
    name: Solar Polarity Reversed
    path: test_circuits/faults/erc_open_short/solar_polarity_reversed.cnet
    topology_family: ERC open/short
    purpose: Solar panel positive is on ground and negative is on PANEL_POS.
    expected_diagnostics: [ERC_POSITIVE_TERMINAL_ON_GROUND, ERC_NEGATIVE_TERMINAL_ON_POSITIVE_RAIL, ERC_POWER_GND_SHORT, ERC_POWER_GND_SHORT, ERC_SUPPLY_NET_CONFLICT, ERC_SUPPLY_NET_CONFLICT]
    render_allowed: true
  - id: erc_555_power_reversed
    name: 555 Power Reversed
    path: test_circuits/faults/erc_open_short/555_power_reversed.cnet
    topology_family: ERC open/short
    purpose: 555 VCC and GND are intentionally swapped.
    expected_diagnostics: [ERC_GROUND_PIN_ON_POSITIVE_RAIL, ERC_POSITIVE_SUPPLY_PIN_ON_GROUND, ERC_POSITIVE_TERMINAL_ON_GROUND, ERC_NEGATIVE_TERMINAL_ON_POSITIVE_RAIL, ERC_POWER_GND_SHORT, ERC_POWER_GND_SHORT, ERC_SUPPLY_NET_CONFLICT, ERC_SUPPLY_NET_CONFLICT, ERC_POWER_INPUT_NO_SOURCE, ERC_CONTROL_PIN_FLOATING, ERC_CONTROL_PIN_FLOATING]
    render_allowed: true
  - id: erc_op_amp_supply_reversed
    name: Op Amp Supply Reversed
    path: test_circuits/faults/erc_open_short/op_amp_supply_reversed.cnet
    topology_family: ERC open/short
    purpose: Op amp positive and negative supply pins are intentionally swapped.
    expected_diagnostics: [ERC_POSITIVE_SUPPLY_PIN_ON_GROUND, ERC_POSITIVE_TERMINAL_ON_GROUND, ERC_NEGATIVE_TERMINAL_ON_POSITIVE_RAIL, ERC_SUPPLY_POLARITY_REVERSED, ERC_POWER_GND_SHORT, ERC_POWER_GND_SHORT, ERC_SUPPLY_NET_CONFLICT, ERC_SUPPLY_NET_CONFLICT, ERC_POWER_INPUT_NO_SOURCE]
    render_allowed: true
  - id: erc_mcu_vdd_missing
    name: MCU VDD Missing
    path: test_circuits/faults/erc_open_short/mcu_vdd_missing.cnet
    topology_family: ERC open/short
    purpose: MCU positive supply pin is intentionally left unconnected.
    expected_diagnostics: [ERC_REQUIRED_PIN_UNCONNECTED]
    render_allowed: true
  - id: erc_mcu_gnd_missing
    name: MCU GND Missing
    path: test_circuits/faults/erc_open_short/mcu_gnd_missing.cnet
    topology_family: ERC open/short
    purpose: MCU ground pin is intentionally left unconnected.
    expected_diagnostics: [ERC_REQUIRED_PIN_UNCONNECTED]
    render_allowed: true
  - id: erc_power_input_no_source
    name: Power Input With No Source
    path: test_circuits/faults/erc_open_short/power_input_no_source.cnet
    topology_family: ERC open/short
    purpose: MCU VDD is connected to a named rail with no source.
    expected_diagnostics: [ERC_POWER_INPUT_NO_SOURCE]
    render_allowed: true
  - id: erc_control_pin_floating
    name: Control Pin Floating
    path: test_circuits/faults/erc_open_short/control_pin_floating.cnet
    topology_family: ERC open/short
    purpose: 555 RESET control pin is intentionally left floating.
    expected_diagnostics: [ERC_CONTROL_PIN_FLOATING]
    render_allowed: true
  - id: erc_polarized_capacitor_shorted
    name: Polarized Capacitor Shorted
    path: test_circuits/faults/erc_open_short/polarized_capacitor_shorted.cnet
    topology_family: ERC open/short
    purpose: Polarized capacitor positive and negative terminals are intentionally tied together.
    expected_diagnostics: [ERC_CAPACITOR_TERMINALS_SHORTED, ERC_SUPPLY_TERMINALS_SHORTED, ERC_POWER_GND_SHORT, ERC_SUPPLY_NET_CONFLICT, ERC_POSITIVE_SUPPLY_PIN_ON_GROUND, ERC_GROUND_PIN_ON_POSITIVE_RAIL]
    render_allowed: true
  - id: erc_diode_terminals_shorted
    name: Diode Terminals Shorted
    path: test_circuits/faults/erc_open_short/diode_terminals_shorted.cnet
    topology_family: ERC open/short
    purpose: Diode anode and cathode are intentionally tied together.
    expected_diagnostics: [ERC_DIODE_TERMINALS_SHORTED]
    render_allowed: true
