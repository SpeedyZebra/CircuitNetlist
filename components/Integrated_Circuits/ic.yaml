  part_number: LM358-compatible
  package: DIP/SOIC-8 functional pinout
  description: Generic LM358-style dual operational amplifier.
  body: {renderer: functional_block, width: 220, height: 250, fill: "#f4f4f4", stroke: "#222222", pin_pitch: 32}
  parameters: {role: {required: false}}
  pins:
    - {number: "1", name: OUTA, aliases: [OUT1], side: right, position: 2, electrical_type: output, intent: op_amp_output}
    - {number: "2", name: INA-, aliases: [IN1-, A-], side: left, position: 2, electrical_type: input, intent: op_amp_input}
    - {number: "3", name: INA+, aliases: [IN1+, A+], side: left, position: 3, electrical_type: input, intent: op_amp_input}
    - {number: "4", name: GND, aliases: [V-, VSS], side: bottom, position: 4, electrical_type: power_in, intent: op_amp_negative_supply}
    - {number: "5", name: INB+, aliases: [IN2+, B+], side: left, position: 5, electrical_type: input, intent: op_amp_input, required: false}
    - {number: "6", name: INB-, aliases: [IN2-, B-], side: left, position: 6, electrical_type: input, intent: op_amp_input, required: false}
    - {number: "7", name: OUTB, aliases: [OUT2], side: right, position: 6, electrical_type: output, intent: op_amp_output, required: false}
    - {number: "8", name: VCC, aliases: [V+, VDD], side: top, position: 4, electrical_type: power_in, intent: op_amp_positive_supply}
  metadata:
    verified_status: generic_verified_pinout
    summary: LM358-style dual single-supply operational amplifier using the common 8-pin channel pinout.
    function: Amplifies or buffers analog signals with external feedback networks.
    common_use: Signal conditioning, buffering, low-speed sensor front ends, and simple active filters.
    notes: Generic LM358-compatible schematic symbol; electrical limits are not simulated.
    pins:
      VCC: {description: Positive amplifier supply.}
      GND: {description: Negative supply or ground for single-supply operation.}
      INA-: {description: Channel A inverting input.}
      INA+: {description: Channel A non-inverting input.}
      OUTA: {description: Channel A output.}
      INB+: {description: Channel B non-inverting input.}
      INB-: {description: Channel B inverting input.}
      OUTB: {description: Channel B output.}
- id: IC_LM393_COMPARATOR
  name: LM393 Comparator
  category: IC
  manufacturer: Generic
  part_number: LM393-compatible
  package: DIP/SOIC-8 functional pinout
  description: Generic LM393-style dual open-collector comparator.
  body: {renderer: functional_block, width: 220, height: 250, fill: "#f4f4f4", stroke: "#222222", pin_pitch: 32}
  parameters: {role: {required: false}}
  pins:
    - {number: "1", name: OUTA, aliases: [OUT1], side: right, position: 2, electrical_type: open_drain, intent: open_drain_output}
    - {number: "2", name: INA-, aliases: [IN1-, A-], side: left, position: 2, electrical_type: input, intent: analog_input}
    - {number: "3", name: INA+, aliases: [IN1+, A+], side: left, position: 3, electrical_type: input, intent: analog_input}
    - {number: "4", name: GND, aliases: [VSS], side: bottom, position: 4, electrical_type: power_in, intent: supply_ground}
    - {number: "5", name: INB+, aliases: [IN2+, B+], side: left, position: 5, electrical_type: input, intent: analog_input, required: false}
    - {number: "6", name: INB-, aliases: [IN2-, B-], side: left, position: 6, electrical_type: input, intent: analog_input, required: false}
    - {number: "7", name: OUTB, aliases: [OUT2], side: right, position: 6, electrical_type: open_drain, intent: open_drain_output, required: false}
    - {number: "8", name: VCC, aliases: [VDD], side: top, position: 4, electrical_type: power_in, intent: supply_positive}
  metadata:
    verified_status: generic_verified_pinout
    summary: LM393-style dual comparator with open-collector outputs that need pull-up resistors.
    function: Compares two analog input voltages and pulls the output low when the selected threshold condition is met.
    common_use: Threshold detectors, sensor trip points, battery monitors, and digital wake inputs.
    warnings: Comparator outputs are open-collector/open-drain and require an external pull-up.
    pins:
      VCC: {description: Positive comparator supply.}
      GND: {description: Ground reference.}
      INA-: {description: Channel A inverting input.}
      INA+: {description: Channel A non-inverting input.}
      OUTA: {description: Channel A open-collector output; add a pull-up.}
      INB+: {description: Channel B non-inverting input.}
      INB-: {description: Channel B inverting input.}
      OUTB: {description: Channel B open-collector output; add a pull-up.}
