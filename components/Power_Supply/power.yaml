- id: POWER_CHARGER_BQ25185_BLOCK
  name: BQ25185 Charger
  category: Power_Supply
  manufacturer: Texas Instruments
  part_number: BQ25185
  description: Functional charger symbol, not physical IC pinout.
  body: {renderer: functional_block, width: 190, height: 260, pin_pitch: 32}
  pins:
    - {number: "1", name: VIN, aliases: [], side: left, position: 1, electrical_type: power_in}
    - {number: "2", name: GND, aliases: [], side: left, position: 6, electrical_type: power_in}
    - {number: "3", name: BAT, aliases: [], side: right, position: 1, electrical_type: bidirectional}
    - {number: "4", name: SYS, aliases: [], side: right, position: 2, electrical_type: power_out}
    - {number: "5", name: TS, aliases: [], side: left, position: 3, electrical_type: input, required: false}
    - {number: "6", name: STAT, aliases: [], side: right, position: 4, electrical_type: open_drain, required: false}
    - {number: "7", name: CE, aliases: [], side: left, position: 4, electrical_type: input, required: false}
  metadata: {functional_symbol: true}
