- id: POWER_CHARGER_BQ25185_BLOCK
  name: BQ25185 Charger
  category: Power_Supply
  manufacturer: Texas Instruments
  part_number: BQ25185
  description: Functional charger symbol, not physical IC pinout.
  body: {renderer: functional_block, width: 190, height: 260, pin_pitch: 32}
  pins:
    - {number: "1", name: VIN, aliases: [], side: left, position: 1, electrical_type: power_in, intent: charger_input}
    - {number: "2", name: GND, aliases: [], side: left, position: 6, electrical_type: power_in, intent: supply_ground}
    - {number: "3", name: BAT, aliases: [], side: right, position: 1, electrical_type: bidirectional, intent: charger_battery}
    - {number: "4", name: SYS, aliases: [], side: right, position: 2, electrical_type: power_out, intent: regulator_output, required: false}
    - {number: "5", name: TS, aliases: [], side: left, position: 3, electrical_type: input, intent: analog_input, required: false}
    - {number: "6", name: STAT, aliases: [], side: right, position: 4, electrical_type: open_drain, intent: open_drain_output, required: false}
    - {number: "7", name: CE, aliases: [], side: left, position: 4, electrical_type: input, intent: control_pin, required: false}
  metadata:
    verified_status: functional_block
    functional_symbol: true
    summary: Functional BQ25185-style single-cell battery charger block.
    function: Accepts input power, charges the battery node, and provides a system output rail.
    warnings: This is a schematic functional block, not a physical IC pinout.
    pins:
      VIN: {description: Charger input power.}
      GND: {description: Charger ground reference.}
      BAT: {description: Battery connection.}
      SYS: {description: System output rail.}
      TS: {description: Battery temperature sense input.}
      STAT: {description: Open-drain charge status output.}
      CE: {description: Charger enable input.}
