  pins:
    - {number: "1", name: POS, aliases: [PLUS, +], side: right, position: 1, electrical_type: power_out, intent: battery_positive}
    - {number: "2", name: NEG, aliases: [MINUS, -], side: right, position: 2, electrical_type: passive, intent: battery_negative}
  metadata:
    verified_status: generic
    nominal_voltage_v: 3.7
    max_charged_voltage_v: 4.2
