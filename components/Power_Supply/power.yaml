- id: POWER_DC_SOURCE
  name: DC Voltage Source
  category: Power_Supply
  description: Generic DC source block for schematic-level validation.
  body: {renderer: dc_source, width: 100, height: 120, pin_pitch: 50}
  parameters: {voltage: {required: true, unit: V}, role: {required: false}}
  pins:
    - {number: "1", name: POS, aliases: [PLUS, +, VOUT], side: top, position: 1, electrical_type: power_out}
    - {number: "2", name: NEG, aliases: [MINUS, -, GND], side: bottom, position: 1, electrical_type: passive}
  metadata: {functional_symbol: true, source_type: dc_voltage}
