- id: LIGHT_LED_WHITE
  name: White LED
  category: Lighting
  body: {renderer: led, width: 140, height: 100, pin_pitch: 40}
  parameters: {vf: {required: false, unit: V}, current: {required: false, unit: A}, internally_regulated: {required: false}}
  pins: &ledpins
    - {number: "1", name: A, aliases: [ANODE], side: left, position: 1, electrical_type: passive, intent: led_anode}
    - {number: "2", name: K, aliases: [CATHODE], side: right, position: 1, electrical_type: passive, intent: led_cathode}
  metadata: &ledmeta
    verified_status: generic
    summary: Light-emitting diode. It conducts from anode to cathode and emits light when forward biased.
    warnings: Most LEDs need current limiting unless they are internally regulated.
    pins:
      A: {description: Anode; connect toward the positive side of the LED current path.}
      K: {description: Cathode; connect toward the return or switched low side.}
