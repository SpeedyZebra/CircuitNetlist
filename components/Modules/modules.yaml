    verified_status: module_level_abstraction
    module_level: true
    summary: Arduino Nano style ATmega328P development module with a verified subset of commonly used power, PWM, ADC, and I2C pins.
    function: Provides 5 V MCU GPIO, PWM load control, ADC inputs, and I2C pins for beginner embedded circuits.
    common_use: Small MCU controller for LED, MOSFET, sensor, relay, and motor examples.
    notes: Schematic abstraction, not a complete 30-pin mechanical footprint.
    pins:
      VIN: {description: Raw input supply to the module regulator when used.}
      5V: {description: 5 V module logic supply in this abstraction.}
      GND: {description: Ground reference.}
      D3_PWM: {description: Digital I/O with PWM capability, useful for MOSFET gate drive.}
      D5_PWM: {description: Digital I/O with PWM capability.}
      A0: {description: ADC input on the ATmega328P module.}
      A4_SDA: {description: I2C data pin on Arduino Nano.}
      A5_SCL: {description: I2C clock pin on Arduino Nano.}
