  description: Module-level Arduino Nano / ATmega328P schematic abstraction.
  body: {renderer: functional_block, width: 230, height: 300, fill: "#f4f4f4", stroke: "#222222", pin_pitch: 32}
  parameters: {role: {required: false}}
  pins:
    - {number: "1", name: VIN, aliases: [RAW], side: left, position: 1, electrical_type: power_in, intent: supply_positive, required: false}
    - {number: "2", name: 5V, aliases: [VCC], side: left, position: 2, electrical_type: power_in, intent: supply_positive}
    - {number: "3", name: GND, aliases: [GND1, GND2], side: left, position: 8, electrical_type: power_in, intent: supply_ground}
    - {number: "4", name: D3_PWM, aliases: [D3, PWM3], side: right, position: 2, electrical_type: bidirectional, intent: digital_output}
    - {number: "5", name: D5_PWM, aliases: [D5, PWM5], side: right, position: 3, electrical_type: bidirectional, intent: digital_output}
    - {number: "6", name: A0, aliases: [ADC0], side: right, position: 5, electrical_type: input, intent: analog_input}
    - {number: "7", name: A4_SDA, aliases: [A4, SDA], side: right, position: 7, electrical_type: bidirectional, intent: digital_input}
    - {number: "8", name: A5_SCL, aliases: [A5, SCL], side: right, position: 8, electrical_type: bidirectional, intent: digital_output}
