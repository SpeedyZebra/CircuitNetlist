- id: BASIC_RESISTOR
  name: Resistor
  category: Basic
  body: {renderer: resistor, width: 140, height: 80, pin_pitch: 40}
  parameters: {value: {required: true, unit: ohm}, part: {required: false}, role: {required: false}}
  pins: &twopin
    - {number: "1", name: "1", aliases: [A], side: left, position: 1, electrical_type: passive}
    - {number: "2", name: "2", aliases: [B], side: right, position: 1, electrical_type: passive}
  metadata:
    verified_status: generic
    summary: Two-terminal passive used to control current and voltage.
    function: Limits current, forms dividers, creates pull-ups/pull-downs, or sets RC timing.
    pins:
      "1": {description: First passive terminal.}
      "2": {description: Second passive terminal.}
- id: BASIC_CAPACITOR_CERAMIC
  name: Ceramic Capacitor
  category: Basic
  body: {renderer: capacitor, width: 140, height: 80, pin_pitch: 40}
  parameters: {value: {required: true, unit: F}, role: {required: false}}
  pins: *twopin
  metadata:
    verified_status: generic
    summary: Non-polarized capacitor for filtering, bypass, timing, and coupling.
    function: Stores charge and shunts changing signals according to frequency.
    pins:
      "1": {description: First passive terminal.}
      "2": {description: Second passive terminal.}
- id: BASIC_CAPACITOR_POLARIZED
  name: Polarized Capacitor
  category: Basic
  body: {renderer: polarized_capacitor, width: 140, height: 80, pin_pitch: 40}
  parameters: {value: {required: true, unit: F}, role: {required: false}}
  pins:
    - {number: "1", name: POS, aliases: ["+"], side: left, position: 1, electrical_type: passive, intent: supply_positive}
    - {number: "2", name: NEG, aliases: ["-"], side: right, position: 1, electrical_type: passive, intent: supply_ground}
  metadata:
    verified_status: generic
    summary: Polarized capacitor for bulk energy storage and low-frequency filtering.
    warnings: Observe polarity; reverse voltage can damage real capacitors.
    pins:
      POS: {description: Positive terminal.}
      NEG: {description: Negative terminal.}
- id: BASIC_INDUCTOR
  name: Inductor
  category: Basic
  body: {renderer: inductor, width: 140, height: 80, pin_pitch: 40}
  parameters: {value: {required: true, unit: H}, role: {required: false}}
  pins: *twopin
  metadata:
    verified_status: generic
    summary: Two-terminal inductive element used for coils, filters, motors, and relay windings.
    function: Stores energy in a magnetic field and resists current changes.
    pins:
      "1": {description: First coil terminal.}
      "2": {description: Second coil terminal.}
- id: BASIC_DIODE
  name: Diode
  category: Basic
  body: {renderer: diode, width: 140, height: 80, pin_pitch: 40}
  parameters: {part: {required: false}, role: {required: false}}
  pins:
    - {number: "1", name: A, aliases: [ANODE], side: left, position: 1, electrical_type: passive, intent: diode_anode}
    - {number: "2", name: K, aliases: [CATHODE], side: right, position: 1, electrical_type: passive, intent: diode_cathode}
  metadata:
    verified_status: generic
    summary: Two-terminal diode that conducts primarily from anode to cathode.
    common_use: Flyback clamp across relay coils, polarity steering, and simple rectification.
    pins:
      A: {description: Anode; conventional current enters here when forward biased.}
      K: {description: Cathode; bar side of the diode symbol.}
- id: BASIC_OP_AMP
  name: Operational Amplifier
  category: Basic
  body: {renderer: op_amp, width: 160, height: 120, pin_pitch: 20}
  parameters: {part: {required: false}, role: {required: false}}
  pins:
    - {number: "1", name: IN-, aliases: [INV, "-", NEG], side: left, position: 2, electrical_type: input, intent: op_amp_input}
    - {number: "2", name: IN+, aliases: [NONINV, "+", POS], side: left, position: 4, electrical_type: input, intent: op_amp_input}
    - {number: "3", name: OUT, aliases: [OUTPUT], side: right, position: 3, electrical_type: output, intent: op_amp_output}
    - {number: "4", name: V+, aliases: [VCC, VDD, VP], side: top, position: 4, electrical_type: power_in, intent: op_amp_positive_supply}
    - {number: "5", name: V-, aliases: [VEE, VSS, VN], side: bottom, position: 4, electrical_type: power_in, intent: op_amp_negative_supply}
  metadata:
    verified_status: generic
    summary: Generic operational amplifier symbol for schematic-level analog circuits.
    function: Amplifies the voltage difference between IN+ and IN- according to feedback.
    pins:
      IN-: {description: Inverting input.}
      IN+: {description: Non-inverting input.}
      OUT: {description: Amplifier output.}
      V+: {description: Positive supply rail.}
      V-: {description: Negative supply rail or ground for single-supply use.}
- id: BASIC_555_TIMER
  name: 555 Timer
  category: Basic
  body: {renderer: timer_555, width: 180, height: 220, pin_pitch: 36}
  parameters: {part: {required: false}, role: {required: false}}
  pins:
    - {number: "1", name: GND, aliases: [GROUND, VSS], side: bottom, position: 4, electrical_type: power_in, intent: supply_ground}
    - {number: "2", name: TRIG, aliases: [TRIGGER], side: left, position: 3, electrical_type: input, intent: timing_pin}
    - {number: "3", name: OUT, aliases: [OUTPUT], side: right, position: 3, electrical_type: output, intent: digital_output}
    - {number: "4", name: RESET, aliases: [RST], side: top, position: 4, electrical_type: input, intent: reset_pin}
    - {number: "5", name: CTRL, aliases: [CONTROL, CV], side: bottom, position: 2, electrical_type: input, intent: control_pin}
    - {number: "6", name: THRESH, aliases: [THRESHOLD], side: left, position: 4, electrical_type: input, intent: timing_pin}
    - {number: "7", name: DISCH, aliases: [DISCHARGE], side: left, position: 2, electrical_type: open_drain, intent: open_drain_output}
    - {number: "8", name: VCC, aliases: [VDD, V+], side: top, position: 2, electrical_type: power_in, intent: supply_positive}
  metadata:
    verified_status: generic
    summary: Timer/oscillator IC commonly used for monostable and astable timing circuits.
    function: Compares timing-capacitor voltage against internal thresholds and drives OUT/DISCH.
    common_use: Oscillators, pulse stretching, delays, LED flashers, tone generators.
    pins:
      VCC: {description: Positive supply.}
      GND: {description: Ground reference.}
      TRIG: {description: Starts timing when pulled low.}
      THRESH: {description: Ends timing when capacitor voltage reaches threshold.}
      DISCH: {description: Open-drain discharge transistor for the timing capacitor.}
      OUT: {description: Output waveform pin.}
      RESET: {description: Active-low reset input.}
      CTRL: {description: Control-voltage input, often bypassed to ground.}
- id: BASIC_NMOS
  name: N-MOSFET
  category: Basic
  body: {renderer: nmos, width: 140, height: 120, pin_pitch: 40}
  parameters: {part: {required: false}, role: {required: false}}
  pins:
    - {number: "1", name: G, aliases: [GATE], side: left, position: 1, electrical_type: input, intent: mosfet_gate}
    - {number: "2", name: D, aliases: [DRAIN], side: top, position: 2, electrical_type: passive, intent: mosfet_drain}
    - {number: "3", name: S, aliases: [SOURCE], side: bottom, position: 2, electrical_type: passive, intent: mosfet_source}
  metadata:
    verified_status: generic
    mosfet_mode: enhancement
    show_body_diode: false
    generic_symbol: true
    summary: Voltage-controlled transistor. Gate voltage controls drain-source conduction.
    warnings: Gate should normally have a defined startup state via pull-up or pull-down.
    pins:
      G: {description: Gate control input.}
      D: {description: Drain terminal, often connected to the switched load.}
      S: {description: Source terminal, often connected to ground in low-side switching.}
- id: BASIC_PMOS
  name: P-MOSFET
  category: Basic
  body: {renderer: pmos, width: 140, height: 120, pin_pitch: 40}
  parameters: {part: {required: false}, role: {required: false}}
  pins:
    - {number: "1", name: G, aliases: [GATE], side: left, position: 1, electrical_type: input, intent: mosfet_gate}
    - {number: "2", name: D, aliases: [DRAIN], side: bottom, position: 2, electrical_type: passive, intent: mosfet_drain}
    - {number: "3", name: S, aliases: [SOURCE], side: top, position: 2, electrical_type: passive, intent: mosfet_source}
  metadata:
    verified_status: generic
    mosfet_mode: enhancement
    show_body_diode: false
    generic_symbol: true
    summary: P-channel MOSFET symbol for high-side or complementary switching.
    pins:
      G: {description: Gate control input.}
      D: {description: Drain terminal.}
      S: {description: Source terminal.}
- id: BASIC_GROUND
  name: Ground
  category: Basic
  body: {renderer: ground, width: 120, height: 80, pin_pitch: 20}
  pins:
    - {number: "1", name: GND, aliases: [0V], side: top, position: 3, electrical_type: power_in, intent: supply_ground}
- id: BASIC_TEST_POINT
  name: Test Point
  category: Basic
  body: {renderer: test_point, width: 90, height: 70, pin_pitch: 35}
  parameters: {role: {required: false}}
  pins:
    - {number: "1", name: TP, aliases: [POINT], side: left, position: 1, electrical_type: passive}
